spring.application.name=springBootTest

# ---- 端口 ----
server.port=8081
server.encoding.charset=UTF-8
server.encoding.enabled=true
server.encoding.force=true

# ---- 数据源（库不存在会自动创建）----
# 密码/密钥已外置为环境变量，默认值仅用于本地开发；生产请在启动脚本或 .env 中覆盖
spring.datasource.url=jdbc:mysql://localhost:3306/sanguo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---- 启动时自动建表（幂等）----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# ---- MyBatis-Plus ----
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# ---- JWT（生产环境请务必通过环境变量覆盖密钥）----
sanguo.jwt.secret=${JWT_SECRET:sanguo-login-jwt-secret-key-2026-fenglin-please-change-me}
sanguo.jwt.expire-hours=12
# 后台管理令牌的角色声明值（内置管理员见 DemoDataSeeder）
sanguo.jwt.admin-role=admin

# ---- 播种账号（仅首次建库时使用，改密码请通过环境变量覆盖）----
sanguo.seed.admin-username=${SEED_ADMIN_USERNAME:admin}
sanguo.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
sanguo.seed.demo-password=${SEED_DEMO_PASSWORD:danfeng123}

# ---- 精简日志 / 启动速度 ----
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.fenglin.springboottest=info
