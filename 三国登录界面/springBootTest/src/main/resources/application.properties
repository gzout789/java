spring.application.name=springBootTest

# ---- 端口 ----
server.port=8081
server.encoding.charset=UTF-8
server.encoding.enabled=true
server.encoding.force=true

# ---- 数据源（库不存在会自动创建）----
spring.datasource.url=jdbc:mysql://localhost:3306/sanguo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---- 启动时自动建表（幂等）----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# ---- MyBatis-Plus ----
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# ---- JWT（生产环境请换掉密钥）----
sanguo.jwt.secret=sanguo-login-jwt-secret-key-2026-fenglin-please-change-me
sanguo.jwt.expire-hours=12

# ---- 精简日志 / 启动速度 ----
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.fenglin.springboottest=info
